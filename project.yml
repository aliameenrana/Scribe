name: Scribe
options:
  bundleIdPrefix: com.meetingscribe
  deploymentTarget:
    macOS: "13.0"
targets:
  MeetingScribe:
    type: application
    platform: macOS
    name: Scribe
    sources:
      - path: MeetingScribe/Sources
    resources:
      - path: MeetingScribe/Resources
    info:
      path: MeetingScribe/Info.plist
      properties:
        CFBundleName: Scribe
        CFBundleDisplayName: Scribe
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSMicrophoneUsageDescription: "Scribe needs microphone access to record and transcribe meetings."
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: "public.app-category.productivity"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meetingscribe.app
        PRODUCT_NAME: Scribe
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
